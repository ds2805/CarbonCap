{% extends "base.html" %}
{% block title %}Register — CarbonCap{% endblock %}
{% block content %}
<h2>Register</h2>
<!-- Kavya: style this form; logic already wired to auth.py -->
<form method="POST">
    <label>Username <input type="text" name="username" required></label><br>
    <label>Password <input type="password" name="password" required></label><br>
    <label>Role
        <select name="role">
            {% for role in roles %}
            <option value="{{ role }}">{{ role }}</option>
            {% endfor %}
        </select>
    </label><br>
    <button type="submit">Create account</button>
</form>
{% endblock %}
